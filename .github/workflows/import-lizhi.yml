              patch.extractall(path=".", filter="data")
          updated = json.loads((root / "sources/lizhi.json").read_text())
          for track in updated["tracks"]:
              path = root / track["publishedPath"]
              assert path.stat().st_size == track["bytes"] and hashlib.sha256(path.read_bytes()).hexdigest() == track["sha256"], str(path)
          files = list((root / "dist/audio").rglob("*.mp3"))
          assert len(files) == 109, f"Expected 109 MP3 files, found {len(files)}"
          size = sum(p.stat().st_size for p in (root / "dist").rglob("*") if p.is_file())
          assert size < 1_000_000_000, f"Published site exceeds the Pages size limit: {size}"
          print(f"Verified all 78 imported files; 109 MP3 files total; static site {size} bytes", flush=True)
      - name: Verify playback and sharing
        run: |
          node tests/playback.cjs
          node tests/share-video.cjs
      - name: Commit owned audio and playback paths
        run: |
          git add -- dist/audio/lizhi dist/catalog-lizhi.js dist/index.html dist/sw.js sources/lizhi.json README.md AGENTS.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Store all 78 Li Zhi MP3 files and use owned audio URLs'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static player
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: import
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

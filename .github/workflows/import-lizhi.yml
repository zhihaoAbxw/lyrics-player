name: Import Li Zhi audio and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-lizhi.yml']

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Import and verify Li Zhi audio
        shell: python
        run: |
          import base64, concurrent.futures, hashlib, io, json, pathlib, subprocess, tarfile
          root = pathlib.Path(".")
          source = json.loads((root / "sources/lizhi.json").read_text())
          assert len(source["tracks"]) == 78, "Expected exactly 78 Li Zhi tracks"
          def import_track(pair):
              index, track = pair
              path = root / f"dist/audio/lizhi/{index:03}.mp3"
              path.parent.mkdir(parents=True, exist_ok=True)
              if path.exists() and hashlib.sha256(path.read_bytes()).hexdigest() == track["sha256"]:
                  print(f"Already verified {path}", flush=True)
                  return
              encoded_path = __import__("urllib.parse", fromlist=["quote"]).quote(track["sourcePath"], safe="/")
              origin = f"https://raw.githubusercontent.com/lvboda/lizhi-mp3/{source['commit']}/{encoded_path}"
              backup = track.get("sourceAudioUrl", track["audioUrl"])
              temp = path.with_suffix(".part")
              for url in (origin, backup):
                  result = subprocess.run(["curl", "--fail", "--location", "--silent", "--show-error", "--retry", "3", "--retry-delay", "2", "--connect-timeout", "30", "--max-time", "240", url, "--output", str(temp)])
                  if result.returncode == 0 and temp.exists() and temp.stat().st_size == track["bytes"] and hashlib.sha256(temp.read_bytes()).hexdigest() == track["sha256"]:
                      data = temp.read_bytes()
                      assert hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest() == track["gitBlob"], f"Git blob mismatch: {path}"
                      temp.replace(path)
                      print(f"Imported and verified {path}", flush=True)
                      return
              raise RuntimeError(f"Unable to import verified audio: {path}")
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(import_track, enumerate(source["tracks"], 1)))
          payload = base64.b64decode("""
          H4sIAB96BmsC/+y9a3dct5km2p/zK2rkw5bYzQvuF8rStOTY031O5qxMp7vnnMnqNQNsABLbFMlDFiW71V5Lii+x46sSx3IcuR07li+J71eZsqK1Zv5JD6tI

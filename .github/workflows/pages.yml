      - name: Commit imported player files
        if: ${{ hashFiles('dist/index.html') != '' }}
        run: |
          git add -- dist tests sources README.md AGENTS.md .gitignore
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Import lyrics player source and verified audio'
            git push origin HEAD:main
          fi
      - name: Verify playback and sharing
        run: |
          node tests/playback.cjs
          node tests/share-video.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static player
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

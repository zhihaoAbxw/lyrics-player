              path.parent.mkdir(parents=True, exist_ok=True)
              temp = path.with_suffix(".part")
              url = base + item["path"].removeprefix("dist/")
              subprocess.run(["curl", "--fail", "--location", "--silent", "--show-error", "--retry", "3", "--retry-delay", "2", "--connect-timeout", "30", "--max-time", "240", url, "--output", str(temp)], check=True)

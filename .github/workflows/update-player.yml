      - name: Verify playback and sharing
        run: |
          node --check dist/appearance.js
          node tests/playback.cjs
          node tests/share-video.cjs
      - name: Commit visual update
        run: |
          git add -- dist/index.html dist/apple-ui.css dist/appearance.js dist/sw.js dist/manifest.webmanifest dist/icon.svg README.md AGENTS.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Align player appearance with Apple Liquid Glass design'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static player
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

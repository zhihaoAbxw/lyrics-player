              patch.extractall(path=".", filter="data")
          for name, digest in after.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest, name
          html = pathlib.Path("dist/index.html").read_text()
          assert '<audio id="audio" preload="auto"></audio>' in html, "Production audio attributes changed"
          assert 'play(' not in pathlib.Path("dist/appearance.js").read_text(), "Appearance script must not start playback"

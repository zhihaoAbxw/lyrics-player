<body>
  <div class="app">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">♪</span><span>歌词随身听</span></div>
      <div class="header-actions"><button class="library-button" id="libraryButton" aria-label="打开曲库" aria-controls="sidebar" aria-expanded="false">曲库</button><small class="site-credit">© abx</small></div>
    </header>
    <main>
      <aside class="sidebar" id="sidebar" aria-label="歌曲列表">
        <div class="library-heading"><h2>曲库</h2><span>109 首歌曲</span></div>
        <div class="library-tabs" id="libraryTabs" data-active="zhaolei" role="tablist" aria-label="按歌手查看歌曲">
          <span class="library-tab-indicator" aria-hidden="true"></span>
          <button class="library-tab" id="tab-zhaolei" role="tab" aria-selected="true" aria-controls="libraryPanel" tabindex="0">赵雷</button>
          <button class="library-tab" id="tab-lizhi" role="tab" aria-selected="false" aria-controls="libraryPanel" tabindex="-1">李志</button>
          <button class="library-tab" id="tab-all" role="tab" aria-selected="false" aria-controls="libraryPanel" tabindex="-1">全部</button>
        </div>
        <div class="library-panel" id="libraryPanel" role="tabpanel" aria-labelledby="tab-zhaolei">
          <div class="track-list" id="trackList"></div>
          <p class="library-empty hidden" id="libraryEmpty" role="status">李志的歌曲待添加</p>
        </div>
      </aside>
      <div class="mobile-shade" id="shade"></div>
      <section class="stage" id="playerStage" data-artist="zhaolei">
        <div class="player" id="playerView">
          <div class="visual-shell" id="viewPager" aria-label="封面和歌词，可左右滑动">
            <div class="artwork-view" id="artworkView" aria-label="专辑封面，向左滑查看歌词">
              <div class="cover-group">
                <span class="cover-art"><img id="coverArt" src="cover.jpg" alt="赵雷「没有信号」风筝封面"></span>
                <span class="tap-hint">向左滑查看完整歌词</span>
              </div>
              <div class="now"><h1 id="trackTitle">—</h1><div class="now-actions"><p id="trackMeta">赵雷 · 鸟巢现场</p><button class="subtle-button" id="coverShareButton" aria-label="分享当前歌曲歌词" disabled>分享歌词</button></div></div>
              <div class="mini-lyrics" id="miniLyrics" aria-label="当前歌曲滚动歌词" aria-live="off"></div>
            </div>
            <div class="lyrics-view" id="lyricsView">
              <div class="lyrics-heading"><h2 id="lyricsTitle">—</h2><p id="lyricsMeta">赵雷 · 鸟巢现场</p><div class="lyrics-tools"><span>点歌词可跳转</span><button class="subtle-button" id="lyricShareButton" disabled>分享歌词</button></div></div>
              <div class="lyrics" id="lyrics" aria-label="完整歌词" aria-live="off"></div>
            </div>
          </div>
          <div class="view-dots" aria-hidden="true"><span class="view-dot active" id="coverDot"></span><span class="view-dot" id="lyricsDot"></span></div>
        </div>
      </section>
    </main>
    <section class="controls" id="controls" aria-label="播放控制">
      <div class="progress-row"><span id="currentTime">0:00</span><input id="progress" type="range" min="0" max="100" value="0" step="0.01" aria-label="播放进度" disabled><span id="duration">0:00</span></div>
      <div class="transport"><button class="control mode-control" id="modeButton" aria-label="顺序播放"><span id="modeIcon" aria-hidden="true">→</span><small id="modeLabel">顺序</small></button><button class="control" id="prevButton" aria-label="上一首">⏮</button><button class="control play" id="playButton" aria-label="播放">▶</button><button class="control" id="nextButton" aria-label="下一首">⏭</button><button class="control queue-control" id="queueButton" aria-label="打开播放队列" aria-controls="playbackQueueDialog" aria-haspopup="dialog" aria-expanded="false"><span aria-hidden="true">☷</span><small>队列</small></button></div>
    </section>
  </div>
  <dialog class="queue-dialog" id="playbackQueueDialog" aria-labelledby="queueTitle" aria-describedby="queueSummary">
    <div class="queue-heading"><div><h2 id="queueTitle">播放队列</h2><p id="queueSummary">赵雷 · 31 首</p></div><div class="queue-heading-actions"><button class="subtle-button" id="queueLibraryButton" aria-label="打开曲库切换歌手">切换歌手</button><button class="icon-button queue-close" id="closeQueueButton" aria-label="关闭播放队列" autofocus>×</button></div></div>
    <div class="queue-list" id="playbackQueueList" aria-label="当前播放队列歌曲"></div>
  </dialog>
  <dialog class="share-dialog" id="lyricShareDialog" aria-labelledby="shareTitle" aria-describedby="shareSubtitle">
    <div class="share-heading"><div><h2 id="shareTitle">歌词海报</h2><p id="shareSubtitle"></p></div><button class="icon-button queue-close" id="closeShareButton" aria-label="关闭歌词分享" autofocus>×</button></div>
    <div class="share-selection" id="shareSelection" aria-label="选择要分享的歌词"></div>
    <div class="share-preview hidden" id="sharePreview"><p class="share-image-guide" id="shareImageGuide"><strong>分享到微信状态</strong><span>系统分享图片 → 随身听状态分享 → 保存并打开微信状态<br>未安装组件时，可保存图片后从相册分享</span></p><img id="shareImage" alt="歌词分享图片" aria-describedby="shareImageGuide"><p>已生成 JPG 图片，也可保存后从相册发布。</p></div>
    <div class="share-footer"><p class="share-status" id="shareStatus" role="status"></p><div class="share-selection-actions" id="shareSelectionActions"><span id="shareCount" aria-live="polite">已选 0 句</span><button class="share-primary" id="generateShareButton" disabled>生成图片</button></div><div class="share-preview-actions hidden" id="sharePreviewActions"><div class="share-image-actions"><a class="share-save" id="saveShareImage" download>保存图片</a><button class="share-primary hidden" id="nativeShareButton">系统分享图片</button></div><div class="share-extra-actions"><button class="subtle-button" id="editShareButton">重新选择</button><button class="subtle-button hidden" id="statusVideoButton">生成视频</button><a class="subtle-button hidden" id="saveStatusVideo" download>保存视频</a></div></div></div>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <audio id="audio" preload="auto"></audio>

  <script src="share-card.js?v=34"></script>
  <script src="share-video.js?v=34"></script>
  <script src="lyric-share.js?v=34"></script>
  <script src="app.js?v=35"></script>
  <script src="appearance.js?v=38"></script>
</body>
